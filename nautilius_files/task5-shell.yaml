apiVersion: v1
kind: Pod
metadata:
  name: ndontubo-task5-shell
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: alpine:latest
    command: ["sh", "-c", "sleep 1800"]
    resources:
      requests:
        memory: 256Mi
        cpu: "100m"
      limits:
        memory: 512Mi
        cpu: "500m"
    volumeMounts:
    - name: pvcvolume
      mountPath: /pvcvolume
  volumes:
  - name: pvcvolume
    persistentVolumeClaim:
      claimName: ndontubo-task5
